[project]
name = "graph-projection"
version = "0.1.0"
description = "Rasheed V3 — Graph Projection (ADR 0059): the boundary between the append-only Knowledge Graph (System of Record) and any serving store. A ProjectionRequest (ProjectSource/ProjectDelta/ProjectSnapshot) is transformed by the target-agnostic GraphProjector into an IMMUTABLE ProjectionPackage of operations (upsert/deactivate/delete — no SQL/Cypher/triples). A ProjectionTarget realization applies the package to a store; MemoryProjectionTarget is the reference realization proving the Port. SupabaseProjection/Neo4jProjection/RdfProjection come later, each behind the same boundary. Serving Layer => Upsert, Idempotent, Incremental."
requires-python = ">=3.12"
dependencies = [
    "graph-builder",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "knowledge-extraction",
    "artifact-writers",
]

[tool.uv.sources]
graph-builder = { path = "../graph-builder", editable = true }
knowledge-extraction = { path = "../knowledge-extraction", editable = true }
artifact-writers = { path = "../artifact-writers", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_projection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
