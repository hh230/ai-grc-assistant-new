[project]
name = "devteam-contracts"
version = "0.1.0"
description = "Autonomous Platform Dev Team — shared contracts (ADR 0061). Pure, dependency-light value objects the dev team speaks: the reserved platform TenantContext and DevFinding. Depends only on pipeline-contracts. No engine, no registry, no bus — data only, the bottom of the dev-team dependency graph."
requires-python = ">=3.12"
dependencies = [
    "pipeline-contracts",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[tool.uv.sources]
pipeline-contracts = { path = "../../../v2/packages/pipeline-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devteam_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
