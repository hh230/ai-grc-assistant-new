[project]
name = "governance-plan-execution"
version = "0.1.0"
description = "Rasheed V2 Plan Execution service (ADR 0066 §5) — the living lifecycle of an approved Governance Plan: mark a task done/reopened, attach optional evidence, and recompute current maturity. Deliberately NOT a Mission (execution can run for a year; a Mission cannot) — mirrors governance-session's role relative to Discovery: a thin orchestration layer outside the Mission Engine, composing the pure governance-discovery engine with governance-store persistence."
requires-python = ">=3.12"
dependencies = [
    "governance-discovery",
    "governance-store",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.uv.sources]
governance-discovery = { path = "../governance-discovery", editable = true }
governance-store = { path = "../governance-store", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["governance_plan_execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
