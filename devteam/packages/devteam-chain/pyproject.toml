[project]
name = "devteam-chain"
version = "0.1.0"
description = "Autonomous Platform Dev Team — the correlated fix-it chain model (ADR 0061). A devteam-layer concept ONLY: the Core Mission, Mission Engine, and correlation model are untouched. Tracks per-correlation_ref attempt numbers so the continue-until-green Chain Driver can increment attempts, stop at max_attempts, and raise a ChainAlert (human intervention) instead of opening another mission. Pure — depends on nothing but the standard library."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devteam_chain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
