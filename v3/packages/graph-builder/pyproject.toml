[project]
name = "graph-builder"
version = "0.1.0"
description = "Rasheed V3 — Graph Builder (Stage 4) + the append-only Knowledge Graph (System of Record). Turns Canonical Extraction Artifacts into an append-only graph of nodes (entities) and edges (structural relationships). Conforms to ADR 0058: Independent (runs on any artifact, imports no extractor), Idempotent (re-ingesting the same content_hash is a no-op), Incremental (folds one source in without rebuild). System of Record = Append-only; the serving/query layer is a separate downstream upsert stage. Semantic (Tier-2) edges are added later; this stage carries the structural edges the extractor already emitted."
requires-python = ">=3.12"
dependencies = [
    "knowledge-extraction",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "artifact-writers",
]

[tool.uv.sources]
knowledge-extraction = { path = "../knowledge-extraction", editable = true }
artifact-writers = { path = "../artifact-writers", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
