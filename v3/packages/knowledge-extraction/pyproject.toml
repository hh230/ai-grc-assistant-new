[project]
name = "knowledge-extraction"
version = "0.1.0"
description = "Rasheed V3 Knowledge Extraction Port (ADR 0056 + ADR 0057) — the boundary of Stage-2 extraction. Speaks ONLY `Source -> Canonical Extraction Artifact`; knows NOTHING of PDF/DOCX/XLSX/fitz/openpyxl (pure stdlib, zero I/O deps — it cannot import a document library because it does not depend on one). Every source-family `*KnowledgeExtractor` is a realization behind this Port. The artifact is Canonical (not temporary) and carries its own attributable ArtifactIdentity. Conforms to CANONICAL-MODEL.md v1.3."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
