[project]
name = "nist-csf-extractor"
version = "0.1.0"
description = "Rasheed V3 — NIST CSF Knowledge Extractor: the Reference Realization behind KnowledgeExtractionPort (ADR 0056). Deterministically turns a Verified NIST-CSF 2.0 source into a Canonical Extraction Artifact (Function -> Category -> Subcategory) with zero runtime human decisions and zero invented knowledge. `fitz` is imported lazily so the parser is testable without a document library. NIST CSF 2.0 is Public-Domain."
requires-python = ">=3.12"
dependencies = [
    "knowledge-extraction",
    "pymupdf>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv.sources]
knowledge-extraction = { path = "../knowledge-extraction", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nist_csf_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
