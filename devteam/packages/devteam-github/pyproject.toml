[project]
name = "devteam-github"
version = "0.1.0"
description = "Autonomous Platform Dev Team — GitHub connector (ADR 0061; §17 plugin). A real adapter that watches a GitHub repository's Actions runs over the REST API (via curl through the injected CommandRunner — no new HTTP dependency) and surfaces the latest CI failure as a WorkflowRun. The only GitHub-aware layer; it feeds the fix-it flow with real triggers. Read-only: it observes CI, never changes it."
requires-python = ">=3.12"
dependencies = [
    "devteam-tools",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[tool.uv.sources]
pipeline-contracts = { path = "../../../v2/packages/pipeline-contracts", editable = true }
tool-registry = { path = "../../../v2/packages/tool-registry", editable = true }
devteam-contracts = { path = "../devteam-contracts", editable = true }
devteam-tools = { path = "../devteam-tools", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devteam_github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
