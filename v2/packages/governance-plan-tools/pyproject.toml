[project]
name = "governance-plan-tools"
version = "0.1.0"
description = "Rasheed V2 Governance Plan tools (ADR 0066 §3) — the three Tool Registry tools behind the `generate_governance_plan` Mission: ORG_APPLICABILITY_TOOL (read a concluded session's analysis), PLAN_DRAFT_TOOL (draft the reviewable plan — due dates, bounded LLM prose), and PLAN_FINALIZE_TOOL (the one consequential step: persist the approved draft as a new immutable plan version, ADR 0066 §3.1)."
requires-python = ">=3.12"
dependencies = [
    "governance-discovery",
    "governance-store[postgres]",
    "tool-registry",
    "pipeline-contracts",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.uv.sources]
governance-discovery = { path = "../governance-discovery", editable = true }
governance-store = { path = "../governance-store", editable = true }
tool-registry = { path = "../tool-registry", editable = true }
pipeline-contracts = { path = "../pipeline-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["governance_plan_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
