[project]
name = "governance-store"
version = "0.1.0"
description = "Rasheed V2 Governance Store (ADR 0066) — durable persistence for the AI Governance Planning Engine: discovery sessions/answers and (schema-only so far) organization profiles / generated governance plans/items. The psycopg driver is imported lazily so the package imports without it."
requires-python = ">=3.12"
dependencies = [
    "governance-discovery",
]

[project.optional-dependencies]
# PostgreSQL backend. psycopg is imported lazily, so the core package imports without it.
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
governance-discovery = { path = "../governance-discovery", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["governance_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
