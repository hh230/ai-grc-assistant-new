name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # next build only needs these to exist, not to be live — no route in this app
          # fetches from the DB/AI provider at build time (everything's dynamically
          # rendered), but Next.js still evaluates module-level code during the build.
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret-000000000000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aigrc

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: ./scripts/ci/mypy-workspace.sh
      - run: uv run pytest

  # ADR 0061, Phase 0.2 — close CI gap #1. The v2/ and v3/ packages are standalone uv projects
  # (each its own lock/venv), invisible to the `python` job's root workspace — their ~1,000 tests
  # never ran in CI. This job discovers and runs every standalone suite. Informational-first:
  # `continue-on-error` surfaces results without blocking merges yet; flip it off once the sweep is
  # proven stable (a tracked follow-up, along with per-package caching / a matrix for speed).
  v2-v3-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: python3 devteam/packages/devteam-ci/devteam_ci/test_runner.py

  # The regression gate. Runs 300 synthetic organizations through the real Discovery -> Plan
  # code and fails only when something is WORSE than the committed baseline.
  #
  # BLOCKING, unlike the job above, because it can be: it needs no app, no database, no LLM and
  # no browser, so it is deterministic and cannot flake on infrastructure. A failure here means
  # the product's own logic changed for the worse, and the report names the exact seed to
  # reproduce it locally.
  #
  # It deliberately does NOT pass --http/--browser: those need a running app, which CI has none
  # of, and a gate that always reports "the app was not running" is a gate nobody reads. Those
  # surfaces belong to the pre-release run against a deployed environment.
  harness-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devteam/packages/devteam-harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Regression gate vs committed baseline
        run: uv run python -m devteam_harness --team --count 300 --baseline gate-baseline.json --html harness-report.html
      - name: Upload run dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: devteam/packages/devteam-harness/harness-report.html
