[project]
name = "devteam-protocol"
version = "0.1.0"
description = "Autonomous Platform Dev Team — the agent collaboration protocol (ADR 0061). The BOUNDARY between agents: the messages they exchange (AgentRequest, AgentResult, AgentFinding, AgentDecision, AgentArtifact, AgentHandoff), the AgentRole vocabulary, and the single-method Agent protocol. Agents are realizations of this protocol — exactly as extractors realize the Extraction Port (ADR 0056). Reuses the frozen Core (StepRequest/StepResult, Plan/PlanStep, ApprovalRequest, TenantContext) and duplicates none of it."
requires-python = ">=3.12"
dependencies = [
    "pipeline-contracts",
    "mission-engine",
    "devteam-contracts",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[tool.uv.sources]
pipeline-contracts = { path = "../../../v2/packages/pipeline-contracts", editable = true }
event-bus = { path = "../../../v2/packages/event-bus", editable = true }
mission-engine = { path = "../../../v2/packages/mission-engine", editable = true }
devteam-contracts = { path = "../devteam-contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devteam_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
