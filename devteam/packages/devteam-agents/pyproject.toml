[project]
name = "devteam-agents"
version = "0.1.0"
description = "Autonomous Platform Dev Team — the agents (ADR 0061/0062/0063). Realizations of the Agent protocol: the Foreman (planner) and the specialists (QA, Reviewer, Monitor, Security, Developer — read-only first). Each runs behind an AgentTool through the one Tool execution path (no branching executor): the Mission Engine resolves a step to a Tool via the Registry; the AgentTool resolves the capability to an agent and invokes it. Agents act only through the protocol + tools; they add no engine, lifecycle, registry, or bus."
requires-python = ">=3.12"
dependencies = [
    "mission-engine",
    "tool-registry",
    "pipeline-contracts",
    "devteam-contracts",
    "devteam-protocol",
    "devteam-ci",
    "devteam-tools",
    "devteam-analysis",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[tool.uv.sources]
pipeline-contracts = { path = "../../../v2/packages/pipeline-contracts", editable = true }
event-bus = { path = "../../../v2/packages/event-bus", editable = true }
mission-engine = { path = "../../../v2/packages/mission-engine", editable = true }
tool-registry = { path = "../../../v2/packages/tool-registry", editable = true }
devteam-contracts = { path = "../devteam-contracts", editable = true }
devteam-protocol = { path = "../devteam-protocol", editable = true }
devteam-ci = { path = "../devteam-ci", editable = true }
devteam-tools = { path = "../devteam-tools", editable = true }
devteam-analysis = { path = "../devteam-analysis", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devteam_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
